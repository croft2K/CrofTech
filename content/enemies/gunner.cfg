# Gunner: keeps its distance and shoots in bursts, sidestepping as it fires. Each line is also a
# console variable named enemy.gunner.<setting>; saved changes apply instantly while the game is
# running.

health          40      # health it starts with
width           0.8     # of its box, m
height          1.8     # of its box, m
eye_height      1.6     # above its feet, where it sees from
speed           5       # m/s running
acceleration    8       # as movement's ground_acceleration
turn_speed      360     # degrees a second
sight_range     50      # m
sight_angle     120     # degrees across its view, until it is alerted
reaction_time   0.5     # seconds from noticing a player to going after them
hearing_range   30      # m within which it hears a player's shots
footstep_range  6       # m within which it hears a player running
weapon          machinegun  # the game's weapon it shoots; empty has no ranged attack
attack_range    30      # m within which it shoots at targets it can see
keep_distance   12      # m it stops closing in at while it can shoot
aim_error       4       # degrees its aim may be off by
burst           4       # shots in a row, each after its weapon's fire_interval
burst_pause     1.2     # seconds between bursts
strafe_time     1       # seconds it sidesteps one way while shooting; 0 stands still
melee_damage    0       # each swing that lands; 0 has no melee attack
corpse_time     15      # seconds its body stays after death; -1 stays for good
