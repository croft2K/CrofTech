# Charger: runs straight at players and strikes them. Each line is also a console variable named
# enemy.charger.<setting>; saved changes apply instantly while the game is running.

health          60      # health it starts with
width           0.8     # of its box, m
height          1.6     # of its box, m
eye_height      1.4     # above its feet, where it sees from
speed           7       # m/s running; players run at 8.1
acceleration    8       # as movement's ground_acceleration
turn_speed      540     # degrees a second
sight_range     40      # m
sight_angle     140     # degrees across its view, until it is alerted
reaction_time   0.3     # seconds from noticing a player to going after them
hearing_range   30      # m within which it hears a player's shots
footstep_range  6       # m within which it hears a player running
melee_damage    20      # each swing that lands; 0 has no melee attack
melee_range     0.6     # m from its box to the target's that a swing reaches
melee_windup    0.35    # seconds from starting a swing to the hit
melee_interval  1.1     # seconds between the starts of swings
melee_knockback 4       # m/s a swing that lands adds to the target, away from it
walk_speed      2.5     # m/s on patrol and going back to its post
search_time     8       # seconds it searches where it lost its target; 0 goes straight back
search_radius   8       # m around where it lost its target that it searches
cover_chance    0       # chance it hides each time it is hurt or ends a burst; 0 never
corpse_time     15      # seconds its body stays after death; -1 stays for good
