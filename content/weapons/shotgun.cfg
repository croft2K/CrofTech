# Shotgun: a wide spray of pellets, deadly up close. Each line is also a console variable named
# weapon.shotgun.<setting>; saved changes apply instantly while the game is running.

damage          10      # each pellet that hits
pellets         11      # traces per shot
spread          5       # degrees a pellet may stray from the aim
range           200     # m
fire_interval   1       # seconds between shots while fire is held
raise_time      0.25    # seconds after switching to it before it fires
knockback       1.3     # m/s each pellet that hits adds to the target, along the shot
ammo_per_shot   1       # 0 never runs out
start_ammo      10      # ammo carried at spawn
max_ammo        50      # most ammo it holds
pickup_ammo     10      # in an ammo or weapon pickup that doesn't say how much
given           1       # 1 = carried from spawn
