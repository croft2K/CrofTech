# Machine gun: steady, accurate, light hits. Each line is also a console variable named
# weapon.machinegun.<setting>; saved changes apply instantly while the game is running.

damage          7       # each pellet that hits
pellets         1       # traces per shot
spread          1.5     # degrees a pellet may stray from the aim
range           200     # m
fire_interval   0.1     # seconds between shots while fire is held
raise_time      0.25    # seconds after switching to it before it fires
knockback       0.9     # m/s each pellet that hits adds to the target, along the shot
ammo_per_shot   1       # 0 never runs out
start_ammo      100     # ammo carried at spawn
max_ammo        200     # most ammo it holds
given           1       # 1 = carried from spawn
