# Grenade launcher: grenades that arc, bounce and explode when their fuse runs out, or at once on
# hitting someone. Each line is also a console variable named weapon.grenade_launcher.<setting>;
# saved changes apply instantly while the game is running.

damage              100     # a direct hit
fire_interval       0.8     # seconds between shots while fire is held
raise_time          0.25    # seconds after switching to it before it fires
knockback           12.7    # m/s a direct hit adds to the target, along the grenade's path
ammo_per_shot       1       # 0 never runs out
start_ammo          10      # ammo carried at spawn
max_ammo            50      # most ammo it holds
given               1       # 1 = carried from spawn

projectile_speed    18      # m/s
projectile_gravity  1       # share of movement gravity that pulls it down
bounce              0.65    # share of its speed kept bouncing off the world
fuse                2.5     # seconds before it explodes by itself
splash_damage       100     # at the centre of the explosion, less with distance
splash_radius       3.8     # m
splash_knockback    12.7    # m/s at the centre, away from it
self_damage         0.5     # share of its splash damage you take
