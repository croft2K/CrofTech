# Client settings. Saved changes apply instantly while the game is running. Each line is also a
# console variable named client.<setting>; type its name in the console (key below Esc) to see it.

sensitivity   3       # Quake-style: degrees turned per mouse count = 0.022 x sensitivity
fov           100     # horizontal field of view in degrees at 16:9; wider screens see more
show_stats    1       # frame rate, tick cost and speed overlay
show_entities 0       # window listing every entity and its components, live
