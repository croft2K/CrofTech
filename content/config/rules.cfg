# Rules of play: health, armour and respawning. Saved changes apply instantly while the game is
# running. Each line is also a console variable named rules.<setting>.

start_health    100     # health a player spawns with
start_armour    0       # armour a player spawns with
armour_share    0.66    # share of each hit's damage armour takes while it lasts
respawn_delay   1       # seconds after dying before fire respawns
