# Player movement tuning. Saved changes apply instantly while the game is running.
# Units are metres and seconds. Defaults are classic Quake values (1 Quake unit = 1 inch).

# Ground
max_ground_speed      8.128   # top running speed, m/s
ground_acceleration   10      # how quickly you reach top speed (fraction of it per second)
friction              6       # how quickly you stop
stop_speed            2.54    # below this speed friction bites as if moving this fast

# Air
gravity               20.32   # m/s^2
jump_speed            6.858   # upward speed at take-off; jump height = jump_speed^2 / (2 * gravity)
air_acceleration      10      # steering strength in the air
air_wish_speed_cap    0.762   # low cap + high air_acceleration = strafe-jumping and air control
auto_jump             0       # 1 = holding jump bunny-hops automatically

# Body
step_height           0.457   # tallest ledge you walk up without jumping
min_ground_normal_z   0.7     # slopes steeper than about 45 degrees can't be stood on
player_width          0.8
player_height         1.8
eye_height            1.6     # above the feet
