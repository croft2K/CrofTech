name: CI

on:
  push:
  pull_request:

jobs:
  build:
    name: ${{ matrix.preset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2025, preset: windows-debug }
          - { os: windows-2025, preset: windows-asan }
          - { os: ubuntu-24.04, preset: linux-debug }
          - { os: ubuntu-24.04, preset: linux-asan }
    steps:
      - uses: actions/checkout@v4

      - uses: lukka/get-cmake@latest

      # Puts clang-cl, the MSVC libraries and the Windows SDK on PATH.
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'

      # The client build compiles shaders with glslc from the Vulkan SDK.
      - uses: humbletim/install-vulkan-sdk@v1.2
        if: runner.os == 'Windows'
        with:
          version: latest
          cache: true

      # Runs after msvc-dev-cmd so VCPKG_ROOT points at this pinned clone, not Visual Studio's copy.
      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: 69a1a33b4ba2b21e392c17e215ff637290778a97

      - name: Configure, build and test
        run: cmake --workflow --preset ${{ matrix.preset }}

  # Runs every fuzz target for a minute, starting from its seed corpus. New inputs go to a scratch
  # folder; a crash fails the job and uploads the input that caused it.
  fuzz:
    name: linux-fuzz
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: lukka/get-cmake@latest

      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: 69a1a33b4ba2b21e392c17e215ff637290778a97

      - name: Build fuzz targets
        run: cmake --workflow --preset linux-fuzz

      - name: Fuzz
        run: |
          mkdir -p fuzz-work/level fuzz-work/map fuzz-work/state fuzz-work/save fuzz-work/protocol \
            fuzz-work/wav fuzz-crashes
          bin=build/linux-fuzz/bin
          opts="-max_total_time=60 -timeout=10 -rss_limit_mb=2048 -artifact_prefix=fuzz-crashes/"
          $bin/ct_level_file_fuzz $opts -dict=tests/fuzz/level.dict \
            fuzz-work/level tests/fuzz/corpus/level content/levels
          $bin/ct_map_import_fuzz $opts -dict=tests/fuzz/map.dict \
            fuzz-work/map tests/fuzz/corpus/map
          $bin/ct_state_save_fuzz $opts -dict=tests/fuzz/state.dict \
            fuzz-work/state tests/fuzz/corpus/state
          $bin/ct_save_game_fuzz $opts -dict=tests/fuzz/state.dict \
            fuzz-work/save tests/fuzz/corpus/save
          $bin/ct_protocol_fuzz $opts -dict=tests/fuzz/state.dict \
            fuzz-work/protocol tests/fuzz/corpus/protocol
          $bin/ct_wav_fuzz $opts -dict=tests/fuzz/wav.dict \
            fuzz-work/wav tests/fuzz/corpus/wav content/sounds

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-crashes
          path: fuzz-crashes/
